id: antiquarian
title: The Antiquarian
image: assets/images/characters/webp/antiquarian.webp
personality_short: Nostalgic collector who preserves what the world forgets.
personality: |-
  Nostalgic collector who preserves what the world forgets. Loves old things and the stories they tell and wishes the world didn't have to constantly change.
skills:
- history_1
- art_1
- personal_romano
- is_character_antiquarian
background: |-
  You run a small antiquarian shop, surrounded by other people's memories—every item a piece of someone's story you can't bear to lose. Over the decades, your counter has quietly collected pieces of one story in particular: the **Romano harbor years**. A Venetian bottle with no paperwork. A dockmaster's ledger bought cheap at an estate sale. Photographs of longshoremen whose faces you've come to recognize. Sellers are always vague about origins, but one name keeps surfacing—**Romano**. You've never chased it. You just kept the pieces. Somewhere in the shop is a map of Long Beach's bootlegging years that no historian ever drew, assembled from things nobody else wanted. When you heard about the investigation at the **Montrose mansion**—where the Romanos did business in the 1920s—some of those fragments started to feel relevant. You had to come. You want to know what really happened down at that harbor.
objectives:
  track: dirty_dealings
  aspect: adventure
  private: romano_family_rise_and_fall
  initial_quest: AO79
strategy: |-
  Your 📜 Basic History skill helps with research and local context. Your 🎨 Basic Art skill lets you evaluate and date old objects. Your 👥 Romano connection gives you access to clues about the Romano family that others can't read. But you won't be able to read everything. Find players whose skills complement yours, and trade what you know for what you're missing.
relationships:
  artcollector: |-
    They carry the Romano name. You carry pieces of what that name touched—ledgers, bottles, photographs. Comparing what's in the mansion with what's in your shop could fill in a century of gaps.
  explorer: |-
    They're hunting Romano treasure with maps and legwork. You've been quietly piecing together the same story from estate-sale scraps. What you've catalogued might be the provenance they're missing.
  influencer: |-
    They've come into your shop over the years looking for material for their Long Beach mysteries series. They've covered the Romano treasure legend from the outside; you've been holding pieces of it in a back-room drawer.
