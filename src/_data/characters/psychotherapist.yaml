strategy: |-
  Your 👥 connections to five different families (Montrose, Crane, Whitmore, Monroe, Hartley) give you access to clues about those families that others can't read. But you won't be able to read everything. Find players whose skills complement yours, and trade what you know for what you're missing.
relationships:
  baker: |-
    Someone who bakes the same bread recipe every day like a ritual, for a family they never knew. They don't know where they come from, but they showed up at this mansion like it was pulling them in. You've seen this before—people drawn to places connected to trauma they don't consciously remember.
  dressmaker: |-
    They've kept a dead woman's wedding dress preserved for a hundred years, passed down through their family like a holy relic. That's not sentimentality. That's unresolved grief with a heartbeat.
  portraitartist: |-
    They were hired to restore paintings and ended up unable to leave. They talk about Cordelia Montrose the way people talk about someone they've lost—not someone who died a century ago.
