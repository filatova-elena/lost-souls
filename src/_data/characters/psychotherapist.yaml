background: |-
  You're a psychotherapist, but your real work happens between the lines. You study **generational trauma**—the way pain, shame, and unspoken secrets pass down through families like invisible inheritance. Descendants mourn losses they can't name. Whole lives are shaped by griefs no one ever told them about. You've built a career listening for the silences. So when you heard about the **Montrose mansion**—three deaths in eleven days, a century of silence, and families still not free of it—you couldn't stay away. You've been quietly researching the **Montroses**, the **Cranes**, the **Whitmores**, the **Monroes**, the **Hartleys**. Name changes. Obsessive preservation of artifacts. A branch of the family tree someone took scissors to. You told yourself you were here to observe. But the living always lead you to where the dead are still hurting—and this house is full of them.
