strategy: |-
  Your 📜 Expert History skill lets you read clues others can't—historical documents, timelines, artifact authentication. Your 🔮 Basic Paranormal skill gives you some access to vision clues. But you won't be able to read everything. Find players whose skills complement yours, and trade what you know for what you're missing.
relationships:
  influencer: |-
    Your friend and collaborator—they featured the pocket watch in their Long Beach mysteries series with your commentary. They thought the conjunction theory was a stretch, but they're here now, aren't they?
  professor: |-
    You're obsessed with timing. They're obsessed with plants. Different fixations, but you're both trying to decode what was happening in 1925—and their research might explain why that date mattered.
  astrologer: |-
    They understand exactly what the Jupiter-Venus conjunction symbols on the pocket watch mean. If anyone can help you decode why that date was engraved, it's them.
