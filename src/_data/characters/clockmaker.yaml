background: |-
  You're a clockmaker and horologist—obsessed with time, timing, and the mechanisms that measure it. But you're not just about clocks. You study astronomical timing, consciousness, synchronicities. You believe the universe has patterns, that timing matters, that mystical experiences are real phenomena we're only beginning to measure. For years, you've been obsessing over a specific antique **pocket watch** from 1925. You've examined it in detail—every mechanism, every engraving. Inside, you identified a date and astronomical symbols you recognized immediately—the **Jupiter-Venus conjunction**. You calculated it. **September 4, 1925**, at 6:14 AM. A rare conjunction that happens once in decades. Someone thought this date was important enough to engrave it permanently. The Influencer featured the **pocket watch** in their "Long Beach Urban Legends" series with your expert commentary. You explained the conjunction, the timing, the mystery. They were skeptical (as always—they think your helmet project is pseudoscience too). But the episode led you both here, to this mansion, to **October 1925 deaths** that happened exactly five weeks after that sacred conjunction. This can't be a coincidence. The universe doesn't work that way.
